name: Steve E2E Tests

on:
  workflow_dispatch:
    inputs:
      steve_version:
        description: "Steve version to test (with leading v)"
        required: true
        type: string
      qase_test_run_id:
        description: "Existing Qase test run ID (optional, will create a new run if not provided)"
        required: false
        type: string
        default: ""
      report_to_qase:
        description: "Report results to Qase"
        required: false
        type: boolean
        default: true
      k3s_image:
        description: "k3s image for the test cluster (optional, defaults to k3d's default)"
        required: false
        type: string
        default: ""
      test_run:
        description: "go test -run regex (optional, empty runs the entire suite)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: steve-tests-e2e-${{ inputs.steve_version }}
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=k3d-io/k3d
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0

jobs:
  steve-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STEVE_VERSION: ${{ inputs.steve_version }}
      REPORTING: ${{ inputs.report_to_qase && 'true' || 'false' }}

    steps:
      - name: Checkout steve-tests
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate Qase configuration
        if: env.REPORTING == 'true'
        env:
          QASE_AUTOMATION_TOKEN: ${{ secrets.QASE_AUTOMATION_TOKEN }}
          QASE_PROJECT_ID: ${{ secrets.QASE_PROJECT_ID }}
          PROVIDED_RUN_ID: ${{ inputs.qase_test_run_id }}
        run: |
          set -euo pipefail
          for setting in QASE_AUTOMATION_TOKEN QASE_PROJECT_ID; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Set the ${setting} repository secret, or turn off Report to Qase."
              exit 1
            fi
          done
          if [[ -n "$PROVIDED_RUN_ID" && ! "$PROVIDED_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Qase test run ID must be a positive integer."
            exit 1
          fi

      - name: Validate Steve version
        run: |
          set -euo pipefail

          if [[ ! "$STEVE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Steve version: $STEVE_VERSION"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags https://github.com/rancher/steve.git "refs/tags/${STEVE_VERSION}" >/dev/null; then
            echo "::error::Steve tag ${STEVE_VERSION} does not exist in rancher/steve"
            exit 1
          fi

          echo "Testing Steve ${STEVE_VERSION}"

      - name: Verify Go dependencies
        run: go mod download

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f

      - name: Install k3d
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum --check --strict
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: Start k3d cluster and Steve
        env:
          E2E_K3S_IMAGE: ${{ inputs.k3s_image }}
        run: ./scripts/e2e.sh up

      - name: Format Qase milestone
        id: qase_milestone
        if: env.REPORTING == 'true' && inputs.qase_test_run_id == ''
        run: |
          set -euo pipefail

          # Milestones are prefixed so Steve releases do not collide with
          # apiserver releases that share version numbers in the same project.
          base="${STEVE_VERSION%%-*}"
          milestone="Steve ${base}"

          echo "Steve version: ${STEVE_VERSION}"
          echo "Qase milestone: ${milestone}"

          echo "milestone=${milestone}" >> "$GITHUB_OUTPUT"

      - name: Verify Qase milestone exists
        id: verify-qase-milestone
        if: env.REPORTING == 'true' && inputs.qase_test_run_id == ''
        env:
          QASE_PROJECT_ID: ${{ secrets.QASE_PROJECT_ID }}
          QASE_TOKEN: ${{ secrets.QASE_AUTOMATION_TOKEN }}
          MILESTONE: ${{ steps.qase_milestone.outputs.milestone }}
        run: |
          set -euo pipefail

          echo "Checking for Qase milestone: ${MILESTONE}"

          MILESTONE_RESPONSE=$(curl --fail-with-body -sS --connect-timeout 10 --max-time 60 -G \
            -H "Content-Type: application/json" \
            -H "Token: ${QASE_TOKEN}" \
            --data-urlencode "search=${MILESTONE}" \
            --data-urlencode "limit=100" \
            "https://api.qase.io/v1/milestone/${QASE_PROJECT_ID}")

          MILESTONE_ID=$(echo "$MILESTONE_RESPONSE" |
            jq -r --arg title "$MILESTONE" \
            '.result.entities[]? | select(.title == $title) | .id' |
            head -n 1)

          if [ -n "$MILESTONE_ID" ] && [ "$MILESTONE_ID" != "null" ]; then
            echo "Qase milestone already exists:"
            echo "  Title: ${MILESTONE}"
            echo "  ID: ${MILESTONE_ID}"
          else
            echo "Qase milestone '${MILESTONE}' does not exist. Creating it."

            CREATE_RESPONSE=$(curl --fail-with-body -sS --connect-timeout 10 --max-time 60 -X POST \
              -H "Content-Type: application/json" \
              -H "Token: ${QASE_TOKEN}" \
              -H "Accept: application/json" \
              -d "$(jq -n --arg title "$MILESTONE" \
                '{title: $title}')" \
              "https://api.qase.io/v1/milestone/${QASE_PROJECT_ID}")

            MILESTONE_ID=$(echo "$CREATE_RESPONSE" |
              jq -r '.result.id')

            if [ -z "$MILESTONE_ID" ] || [ "$MILESTONE_ID" = "null" ]; then
              echo "::error::Failed to create Qase milestone '${MILESTONE}'"
              echo "$CREATE_RESPONSE"
              exit 1
            fi

            echo "Created Qase milestone:"
            echo "  Title: ${MILESTONE}"
            echo "  ID: ${MILESTONE_ID}"
          fi

          echo "milestone=${MILESTONE}" >> "$GITHUB_OUTPUT"

      - name: Describe Qase test run
        id: qase-description
        if: env.REPORTING == 'true' && inputs.qase_test_run_id == ''
        run: |
          set -euo pipefail
          {
            echo "description<<EOF"
            echo "GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "steve-tests commit: ${GITHUB_SHA}"
            echo "Steve version: ${STEVE_VERSION}"
            echo "Steve commit: ${STEVE_COMMIT:-unknown}"
            echo "Kubernetes version: ${KUBE_VERSION:-unknown}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Qase test run
        id: create-qase-run
        if: env.REPORTING == 'true' && inputs.qase_test_run_id == ''
        uses: ./.github/actions/create-qase-test-run
        with:
          test_run_name: "Steve_Tests - ${{ inputs.steve_version }}"
          qase_project_id: ${{ secrets.QASE_PROJECT_ID }}
          qase_token: ${{ secrets.QASE_AUTOMATION_TOKEN }}
          qase_milestone: ${{ steps.verify-qase-milestone.outputs.milestone }}
          description: ${{ steps.qase-description.outputs.description }}

      - name: Resolve Qase test run ID
        id: qase-run
        if: env.REPORTING == 'true'
        env:
          PROVIDED_RUN_ID: ${{ inputs.qase_test_run_id }}
          CREATED_RUN_ID: ${{ steps.create-qase-run.outputs.id }}
        run: |
          set -euo pipefail
          run_id="${PROVIDED_RUN_ID:-$CREATED_RUN_ID}"

          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Qase test run ID must be a positive integer."
            exit 1
          fi

          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Run Steve e2e suite and report to Qase
        uses: ./.github/actions/run-test-suite
        env:
          QASE_TEST_RUN_ID: ${{ steps.qase-run.outputs.id }}
          QASE_AUTOMATION_TOKEN: ${{ secrets.QASE_AUTOMATION_TOKEN }}
          QASE_PROJECT_ID: ${{ secrets.QASE_PROJECT_ID }}
        with:
          packages: "./..."
          reporting: ${{ env.REPORTING }}
          test-suite: ${{ inputs.test_run }}
          timeout: "30m"

      - name: Close Qase test run
        if: env.REPORTING == 'true' && env.test_exit_code == '0' && env.qase_report_exit_code == '0'
        uses: ./.github/actions/close-qase-test-run
        with:
          qase_run_id: ${{ steps.qase-run.outputs.id }}
          qase_project_id: ${{ secrets.QASE_PROJECT_ID }}
          qase_token: ${{ secrets.QASE_AUTOMATION_TOKEN }}

      - name: Warn if Qase test run left open
        if: always() && env.REPORTING == 'true' && steps.qase-run.outputs.id != '' && (env.test_exit_code != '0' || env.qase_report_exit_code != '0')
        run: |
          echo "::warning::Qase run ${{ steps.qase-run.outputs.id }} left open (test exit code: ${test_exit_code:-unknown}, report exit code: ${qase_report_exit_code:-unknown})."

      - name: Summarize run
        if: always()
        run: |
          {
            echo "### Steve ${STEVE_VERSION} e2e"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Steve commit | \`${STEVE_COMMIT:-unknown}\` |"
            echo "| Kubernetes | ${KUBE_VERSION:-unknown} |"
            if [ -f results.json ]; then
              for action in pass fail skip; do
                count=$(jq -s --arg a "$action" '[.[] | select(.Test != null and .Action == $a)] | length' results.json)
                echo "| Tests ${action} | ${count} |"
              done
            fi
            echo "| Qase run | ${{ steps.qase-run.outputs.id || 'not reported' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect cluster state
        if: failure()
        run: |
          kubeconfig=.e2e/kubeconfig
          [ -f "$kubeconfig" ] || exit 0
          kubectl --kubeconfig "$kubeconfig" get nodes,pods -A -o wide > .e2e/cluster-state.txt 2>&1 || true
          kubectl --kubeconfig "$kubeconfig" get events -A --sort-by=.lastTimestamp > .e2e/cluster-events.txt 2>&1 || true

      - name: Upload test results and Steve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steve-e2e-${{ inputs.steve_version }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          # Only the files listed below are uploaded, never the kubeconfig.
          include-hidden-files: true
          path: |
            results.json
            results.xml
            .e2e/steve.log
            .e2e/steve-info.env
            .e2e/cluster-*.txt

      - name: Tear down
        if: always()
        run: ./scripts/e2e.sh down
