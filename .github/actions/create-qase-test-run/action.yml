---
name: Create Qase Test Run
description: "Creates a Qase test run, optionally under a milestone, and returns its ID"
inputs:
  test_run_name:
    description: "Name of the test run to create in Qase; today's date is appended"
    required: true
  qase_project_id:
    description: "Qase project ID"
    required: true
  qase_token:
    description: "Qase token"
    required: true
  qase_milestone:
    description: "Title of an existing Qase milestone to assign to the test run"
    required: false
    default: ""
  description:
    description: "Test run description"
    required: false
    default: ""

outputs:
  id:
    description: "ID of the created Qase test run"
    value: ${{ steps.create-qase-run.outputs.run_id }}

runs:
  using: composite
  steps:
    - name: Create Qase test run
      id: create-qase-run
      shell: bash
      env:
        PROJECT: ${{ inputs.qase_project_id }}
        TOKEN: ${{ inputs.qase_token }}
        MILESTONE: ${{ inputs.qase_milestone }}
        RUN_TITLE: ${{ inputs.test_run_name }}
        RUN_DESCRIPTION: ${{ inputs.description }}
      run: |
        set -euo pipefail

        RUN_NAME="${RUN_TITLE} - $(date +'%m/%d/%Y')"
        REQUEST_BODY=$(jq -n \
          --arg title "$RUN_NAME" \
          --arg description "$RUN_DESCRIPTION" \
          --arg project "$PROJECT" \
          '{title: $title, is_autotest: true}
           + (if $description == "" then {} else {description: $description} end)
           + (if $project == "RM" then {custom_field: {"16": "1"}} else {} end)')

        if [ -n "$MILESTONE" ]; then
          MILESTONE_RESPONSE=$(curl --fail-with-body -sS --connect-timeout 10 --max-time 60 -G \
            -H "Content-Type: application/json" \
            -H "Token: $TOKEN" \
            --data-urlencode "search=$MILESTONE" \
            --data-urlencode "limit=100" \
            "https://api.qase.io/v1/milestone/$PROJECT")

          MILESTONE_ID=$(echo "$MILESTONE_RESPONSE" | jq -r --arg title "$MILESTONE" '.result.entities[]? | select(.title == $title) | .id' | head -n 1)

          if [ -z "$MILESTONE_ID" ] || [ "$MILESTONE_ID" = "null" ]; then
            echo "::error::Failed to find Qase milestone '$MILESTONE': $MILESTONE_RESPONSE"
            exit 1
          fi

          REQUEST_BODY=$(echo "$REQUEST_BODY" | jq --argjson milestone_id "$MILESTONE_ID" '. + {milestone_id: $milestone_id}')
          echo "Found Qase milestone ID: $MILESTONE_ID"
        fi

        RESPONSE=$(curl --fail-with-body -sS --connect-timeout 10 --max-time 60 -X POST \
          -H "Content-Type: application/json" \
          -H "Token: $TOKEN" \
          -d "$REQUEST_BODY" \
          "https://api.qase.io/v1/run/$PROJECT")

        RUN_ID=$(echo "$RESPONSE" | jq -r '.result.id')

        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "::error::Failed to create Qase run: $RESPONSE"
          exit 1
        fi

        echo "Created Qase run ID: $RUN_ID"
        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
